<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EEDF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dies Sanctus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F3EEDF;
    --parchment-deep:#EAE2CC;
    --ink:#2B2420;
    --ink-soft:#5A5147;
    --gold:#B8923B;
    --gold-soft:#D9C088;
    --rule:#C9BE9E;
    --verde:#3B6E4F;
    --roxa:#5B3A70;
    --branca:#C9A227;
    --vermelha:#A32638;
    --escarlate:#8C1F2B;
    --preta:#232020;
    --azul:#2f3bad;
    --cor: var(--gold);
    --cor-soft: rgba(184,146,59,0.14);
    --text-scale: 1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%; overscroll-behavior-y:contain; font-size:calc(100% * var(--text-scale));}
  body{
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:0 16px calc(48px + env(safe-area-inset-bottom));
    line-height:1.5;
    transition:background .4s ease;
    overscroll-behavior-y:contain;
    -webkit-user-select:none;
    user-select:none;
    position:relative;
    color:var(--ink);
    
  }

  /* Fixed decorative background layer tied to the viewport */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(circle at 15% -5%, var(--cor-soft), transparent 45%),
      radial-gradient(circle at 100% 100%, var(--cor-soft), transparent 42%),
      var(--parchment);
  }
  .reading .texto, .reading .ref, .vazio-texto{
    -webkit-user-select:text;
    user-select:text;
  }
  .top-bar{
    position:fixed;
    top:0; left:0; right:0;
    height:calc(6px + env(safe-area-inset-top));
    background:var(--cor);
    z-index:5;
    transition:background .4s ease;
  }
  .page{
    width:100%;
    max-width:680px;
    padding-top:calc(44px + env(safe-area-inset-top));
    overflow-wrap:break-word;
  }
  .masthead{
    text-align:center;
    margin-bottom:34px;
  }
  .masthead .eyebrow{
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:.72rem;
    color:var(--ink-soft);
    font-family:'Source Serif 4', serif;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.8rem, 8vw, 2.5rem);
    margin:.25em 0 .1em;
    letter-spacing:-.01em;
  }
  .masthead .data-hoje{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.25rem;
    color:var(--ink-soft);
  }

  .cor-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:14px;
    padding:5px 14px 5px 10px;
    border-radius:20px;
    background:var(--cor-soft);
    border:1px solid var(--cor);
    transition:background .4s ease, border-color .4s ease;
  }
  .cor-badge .dot{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--cor);
    transition:background .4s ease;
    flex-shrink:0;
  }
  .cor-badge span.label{
    font-family:'Source Serif 4', serif;
    font-size:.74rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
  }

  .day-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:22px;
    flex-wrap:wrap;
    width:100%;
  }
  .day-nav button{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex:0 1 auto;
  }
  .day-nav .voltar-hoje{
    border-color:var(--cor);
    color:var(--cor);
  }
  .day-nav .voltar-hoje:hover{
    background:var(--cor);
    color:#fff;
  }

  .seal-wrap{
    display:flex;
    justify-content:center;
    margin:30px 0 30px;
  }
  .seal{
    width:clamp(118px, 32vw, 148px);
    height:clamp(118px, 32vw, 148px);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#F3EEDF;
    font-family:'Fraunces', serif;
    box-shadow:
      0 2px 0 rgba(0,0,0,.25) inset,
      0 -6px 14px rgba(0,0,0,.18) inset,
      0 10px 30px -6px var(--cor);
    position:relative;
    transform:rotate(0deg);
    transition:box-shadow .4s ease;
  }
  .seal::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px dashed rgba(255,255,255,.35);
  }
  .seal .cor-nome{
    font-size:clamp(0.4rem, 2vw, 0.68rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.95;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .seal .ciclo{
    font-size:clamp(1.5rem, 6vw, 2.5rem);
    font-weight:600;
    line-height:1;
    margin:2px 0;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .seal .semana{
    font-size:clamp(0.35rem, 1.8vw, 0.6rem);
    text-align:center;
    padding:0 14px;
    opacity:.95;
    font-family:'Source Serif 4', serif;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }

  .reading.vazio{
    padding:26px 28px;
  }
  .reading.vazio .vazio-texto{
    margin:10px 0 0;
    font-size:.98rem;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .reading.vazio .vazio-texto strong{
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:600;
  }

  .comem-img-wrap{
    max-width:420px;
    margin:24px auto 0;
    text-align:center;
    padding:0 4px;
  }
  .comem-img-wrap .comem-img-frame{
    padding:6px;
    background:linear-gradient(180deg, #FBF8EF, var(--parchment-deep));
    border:1px solid var(--rule);
    border-radius:5px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 18px 40px -20px rgba(43,36,32,.35);
  }
  .comem-img-wrap img{
    width:100%;
    display:block;
    border-radius:2px;
    opacity:0;
    filter:sepia(.12) saturate(1.05);
    transition:opacity .5s ease;
  }
  .comem-img-wrap img.loaded{opacity:1;}
  .comem-img-wrap .comem-img-legenda{
    margin-top:10px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:.92rem;
    line-height:1.4;
    color:var(--ink-soft);
  }

  .season-name{
    text-align:center;
    font-family:'Fraunces', serif;
    font-size:1.4rem;
    font-weight:600;
    margin-bottom:2px;
  }
  .day-name{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:1.15rem;
    margin-bottom:8px;
  }
  .day-name::after{
    content:"";
    display:block;
    width:56px;
    height:3px;
    margin:16px auto 0;
    background:var(--cor);
    border-radius:2px;
    transition:background .4s ease;
  }

  .card{
    background:linear-gradient(180deg, #FBF8EF, var(--parchment-deep));
    border:1px solid var(--rule);
    border-top:3px solid var(--cor);
    border-radius:4px;
    padding:8px 0;
    margin-top:36px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 18px 40px -20px rgba(43,36,32,.35);
    transition:border-top-color .4s ease;
  }

  .reading{
    padding:22px 28px;
    border-bottom:1px solid var(--rule);
  }
  .reading:last-child{border-bottom:none;}
  .reading .label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cor);
    transition:color .4s ease;
    margin-bottom:6px;
  }
  .reading .ref{
    font-size:clamp(1.05rem, 5vw, 1.28rem);
    font-family:'Fraunces', serif;
    font-weight:400;
    overflow-wrap:break-word;
  }
  .reading .texto{
    margin-top:14px;
    font-size:1rem;
    line-height:1.7;
    color:var(--ink);
    border-left:2px solid var(--cor-soft);
    padding-left:16px;
    transition:border-color .4s ease;
    overflow-wrap:break-word;
  }
  .reading .texto .vnum{
    font-size:.68em;
    vertical-align:super;
    color:var(--cor);
    font-weight:600;
    margin-right:1px;
  }
  .reading .texto.carregando,
  .reading .texto.erro{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:.88rem;
    border-left-color:var(--rule);
  }
  .reading .actions{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button, .link-btn{
    font-family:'Source Serif 4', serif;
    font-size:.82rem;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:10px 16px;
    min-height:40px;
    border-radius:20px;
    cursor:pointer;
    text-decoration:none;
    transition:background .15s, color .15s;
    touch-action:manipulation;
  }
  button:hover, .link-btn:hover{
    background:var(--cor);
    border-color:var(--cor);
    color:#fff;
  }
  button:active, .link-btn:active{
    background:var(--cor);
    border-color:var(--cor);
    color:#fff;
    transform:scale(.97);
  }
  button:focus-visible, .link-btn:focus-visible{
    outline:2px solid var(--cor);
    outline-offset:2px;
  }
  button.copiado{
    background:var(--verde);
    border-color:var(--verde);
    color:#fff;
  }

  .toolbar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:28px;
    flex-wrap:wrap;
  }

  .aviso{
    max-width:620px;
    margin:34px auto 0;
    font-size:.82rem;
    color:var(--ink-soft);
    text-align:center;
    padding:0 12px;
  }
  .aviso a{color:var(--roxa);}

  .rodape{
    text-align:center;
    margin-top:25px;
    font-size:.72rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---------- Header controls (calendário + tamanho do texto) ---------- */
  .header-controls{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    right:14px;
    z-index:6;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .icon-btn{
    min-height:36px;
    min-width:36px;
    padding:0 12px;
    font-size:.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(243,238,223,.9);
    backdrop-filter:blur(2px);
  }
  .text-size-wrap{position:relative;}
  .text-size-popover{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:linear-gradient(180deg, #FBF8EF, var(--parchment-deep));
    border:1px solid var(--rule);
    border-radius:10px;
    box-shadow:0 12px 30px -10px rgba(43,36,32,.4);
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:140px;
  }
  .text-size-popover button{
    border:1px solid transparent;
    background:transparent;
    text-align:left;
    padding:8px 12px;
    min-height:auto;
    border-radius:8px;
    font-size:.82rem;
  }
  .text-size-popover button:hover{
    background:var(--cor-soft);
    border-color:var(--cor);
    color:var(--ink);
  }
  .text-size-popover button.active{
    border-color:var(--cor);
    color:var(--cor);
    font-weight:600;
    background:var(--cor-soft);
  }
  .text-size-popover[hidden]{
    display:none;
  }

  /* ---------- Calendário litúrgico (overlay) ---------- */
  .calendar-overlay{
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(43,36,32,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-top:calc(16px + env(safe-area-inset-top));
  }
  .calendar-overlay[hidden]{display:none;}
  .calendar-panel{
    width:100%;
    max-width:420px;
    max-height:calc(100dvh - 32px);
    overflow-y:auto;
    background:linear-gradient(180deg, #FBF8EF, var(--parchment-deep));
    border:1px solid var(--rule);
    border-top:3px solid var(--cor);
    border-radius:10px;
    padding:16px;
    box-shadow:0 20px 50px -15px rgba(0,0,0,.5);
  }
  .calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .calendar-header #calMonthLabel{
    flex:1;
    text-align:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    text-transform:capitalize;
  }
  .calendar-header button{
    min-height:34px;
    min-width:34px;
    padding:0 10px;
    font-size:.9rem;
  }
  .calendar-header .calendar-close{
    border-color:transparent;
    color:var(--ink-soft);
  }
  .calendar-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cal-cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid transparent;
    border-radius:7px;
    font-family:'Source Serif 4', serif;
    font-size:.78rem;
    color:var(--ink);
    min-height:0;
    padding:0;
    position:relative;
    cursor:pointer;
  }
  .cal-cell:hover{
    background:var(--cor-soft) !important;
    color:var(--ink);
  }
  .cal-cell--empty{
    visibility:hidden;
    cursor:default;
  }
  .cal-cell--marcado{
    border-width:2px;
    border-style:solid;
    font-weight:600;
  }
  .cal-cell--marcado::after{
    content:"";
    position:absolute;
    bottom:4px;
    left:50%;
    transform:translateX(-50%);
    width:4px;
    height:4px;
    border-radius:50%;
    background:currentColor;
  }
  .cal-cell--hoje{
    box-shadow:0 0 0 2px var(--cor) inset;
  }
  .cal-cell--selecionado{
    background:var(--cor) !important;
    color:#fff !important;
  }

  @media (max-width:480px){
    body{padding:0 12px calc(40px + env(safe-area-inset-bottom));}
    .reading{padding:16px 16px;}
    .reading.vazio{padding:20px 18px;}
    .card{margin-top:26px;}
    .seal-wrap{margin:22px 0 22px;}
    .day-nav{gap:8px; margin-top:18px;}
    .day-nav button{font-size:.78rem; padding:9px 12px;}
    .toolbar{margin-top:22px;}
    .reading .actions{gap:8px;}
    .reading .actions button, .reading .actions .link-btn{flex:1 1 auto; text-align:center;}
  }

  @media (max-width:360px){
    .masthead .eyebrow{font-size:.64rem;}
    .masthead .data-hoje{font-size:1.05rem;}
    .cor-badge{padding:4px 12px 4px 9px;}
    .cor-badge span.label{font-size:.66rem;}
  }
#btnCalToggle {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  left: 14px;
  z-index: 6;
}
</style>
</head>
<body>
<div class="top-bar" id="topBar"></div>

<div class="header-controls">
  <button id="btnCalToggle" class="icon-btn" aria-label="Abrir calendário litúrgico">📅</button>
  <div class="text-size-wrap">
    <button id="btnTextSize" class="icon-btn" aria-label="Tamanho do texto">Aa</button>
    <div class="text-size-popover" id="textSizePopover" hidden>
      <button type="button" data-scale="0.9">Pequeno</button>
      <button type="button" data-scale="1">Normal</button>
      <button type="button" data-scale="1.15">Grande</button>
      <button type="button" data-scale="1.3">Extra grande</button>
    </div>
  </div>
</div>

<div class="calendar-overlay" id="calendarOverlay" hidden>
  <div class="calendar-panel">
    <div class="calendar-header">
      <button type="button" id="calPrevMonth" aria-label="Mês anterior">←</button>
      <div id="calMonthLabel">—</div>
      <button type="button" id="calNextMonth" aria-label="Próximo mês">→</button>
      <button type="button" id="calClose" class="calendar-close" aria-label="Fechar calendário">✕</button>
    </div>
    <div class="calendar-weekdays">
      <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<div class="page">

  <div class="masthead">
    <div class="eyebrow">Ano da Igreja · IELB</div>
    <h1>Dies Sanctus</h1>
    <div class="data-hoje" id="dataHoje"></div>
    <div class="cor-badge" id="corBadge">
      <span class="dot"></span>
      <span class="label" id="corBadgeLabel">—</span>
    </div>
  </div>

  <div class="day-nav">
    <button id="btnAnterior" aria-label="Dia anterior">← Dia anterior</button>
    <button id="btnHoje" class="voltar-hoje" style="display:none;">Hoje</button>
    <button id="btnProximo" aria-label="Próximo dia">Próximo dia →</button>
  </div>

  <div class="seal-wrap">
    <div class="seal" id="seal">
      <div class="cor-nome" id="corNome">—</div>
      <div class="ciclo" id="cicloLetra">—</div>
      <div class="semana" id="semanaTxt">carregando…</div>
    </div>
  </div>

  <div class="season-name" id="nomeDia">—</div>
  <div class="day-name" id="periodoNome">—</div>

  <div class="comem-img-wrap" id="comemImg" style="display:none;">
    <div class="comem-img-frame">
      <img id="comemImgEl" alt="" loading="eager" fetchpriority="high" decoding="async">
    </div>
    <div class="comem-img-legenda" id="comemImgLegenda"></div>
  </div>

  <div class="card" id="cardLeituras"></div>

  <div class="toolbar"></div>

  <p class="aviso">
    Lecionário do <em>Hinário Luterano (IELB)</em>. Texto Bíblico da <em>Almeida Atualizada</em>.
  </p>

  <div class="rodape" id="rodape">Dies Sanctus</div>
  
</div>

<script>
/* ---------- Dados do lecionário (Trienal A / B / C) ---------- */
/* Cada leitura: [Salmo, Antigo Testamento, Epístola, Evangelho] */
const CYCLES = {
A: {
  advento: [
    ["Sl 122","Is 2.1-5","Rm 13.(8-10)11-14","Mt 21.1-11 ou Mt 24.36-44"],
    ["Sl 72.1-7","Is 11.1-10","Rm 15.4-13","Mt 3.1-12"],
    ["Sl 146","Is 35.1-10","Tg 5.7-10","Mt 11.2-15"],
    ["Sl 24","Is 7.10-17","Rm 1.1-7","Mt 1.18-25"]
  ],
  vespNatal: ["Sl 110.1-4","Is 7.10-14","1Jo 4.7-16","Mt 1.18-25"],
  diaNatal: ["Sl 2","Is 52.7-10","Hb 1.1-6(7-12)","Jo 1.1-14(15-18)"],
  natal1: ["Sl 111","Is 63.7-14","Gl 4.4-7","Mt 2.13-23"],
  natal2: ["Sl 119.97-104","1Rs 3.4-15","Ef 1.3-14","Lc 2.40-52"],
  epifania: ["Sl 72.1-11(12-15)","Is 60.1-6","Ef 3.1-12","Mt 2.1-12"],
  epifaniaDom: [
    ["Sl 29","Is 42.1-9","Rm 6.1-11","Mt 3.13-17"],
    ["Sl 40.1-11","Is 49.1-7","1Co 1.1-9","Jo 1.29-42a"],
    ["Sl 27.1-9(10-14)","Is 9.1-4","1Co 1.10-18","Mt 4.12-25"],
    ["Sl 15","Mq 6.1-8","1Co 1.18-31","Mt 5.1-12"],

/* ---------- Texto bíblico (Almeida Atualizada, domínio público) ---------- */
/* Fonte: raw.githubusercontent.com/MaatheusGois/bible (versions/pt-br/aa) */
const BOOK_IDS = {
  "Gn":"gn","Êx":"ex","Ex":"ex","Lv":"lv","Nm":"nm","Dt":"dt","Js":"js","Jz":"jud","Rt":"rt",
  "1Sm":"1sm","2Sm":"2sm","1Rs":"1kgs","2Rs":"2kgs","1Cr":"1ch","2Cr":"2ch",
  "Ed":"ezr","Ne":"ne","Et":"et","Jó":"job","Sl":"ps","Pv":"prv","Ec":"ec","Ct":"so",
  "Is":"is","Jr":"jr","Lm":"lm","Ez":"ez","Dn":"dn","Os":"ho","Jl":"jl","Am":"am","Ob":"ob",
  "Jn":"jn","Mq":"mi","Na":"na","Hc":"hk","Sf":"zp","Ag":"hg","Zc":"zc","Ml":"ml",
  "Mt":"mt","Mc":"mk","Lc":"lk","Jo":"jo","At":"act","Rm":"rm","1Co":"1co","2Co":"2co",
  "Gl":"gl","Ef":"eph","Fp":"ph","Cl":"cl","1Ts":"1ts","2Ts":"2ts","1Tm":"1tm","2Tm":"2tm",
  "Tt":"tt","Fm":"phm","Hb":"hb","Tg":"jm","1Pe":"1pe","2Pe":"2pe","1Jo":"1jo","2Jo":"2jo",
  "3Jo":"3jo","Jd":"jd","Ap":"re"
};
const SINGLE_CHAPTER_BOOKS = new Set(["Ob","Fm","2Jo","3Jo","Jd"]);
const bookCache = {};
const MAX_INLINE_VERSES = 80;

function refPrincipal(ref){
  return ref.split(" ou ")[0].split(" [ou")[0].trim();
}

async function fetchBook(bookId){
  if(bookCache[bookId]) return bookCache[bookId];
  const url = `https://raw.githubusercontent.com/MaatheusGois/bible/main/versions/pt-br/aa/${bookId}/${bookId}.json`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Falha ao buscar "+bookId);
  const data = await res.json();
  bookCache[bookId] = data;
  return data;
}

function parseRefBlock(book, block){
  block = block.trim();
  // caso sem "." — pode ser (a) livro de capítulo único citado só com
  // versículos (ex.: "Fm 1-21") ou (b) capítulo(s) inteiro(s) de um livro
  // com vários capítulos (ex.: "Sl 122", "Sl 148-150")
  if(!block.includes(".")){
    const nums = [...block.matchAll(/\d+/g)].map(n=>+n[0]);
    if(!nums.length) return null;
    if(SINGLE_CHAPTER_BOOKS.has(book)){
      return {book, c1:1, v1:Math.min(...nums), c2:1, v2:Math.max(...nums)};
    }
    return {book, c1:Math.min(...nums), v1:1, c2:Math.max(...nums), v2:null};
  }
  // caso capítulo cruzado: "26.1-27.66" ou "1.1-2.4a"
  let m = block.match(/^(\d+)\.(\d+)[a-c]?\s*-\s*(\d+)\.(\d+)[a-c]?/);
  if(m) return {book, c1:+m[1], v1:+m[2], c2:+m[3], v2:+m[4]};
  // caso normal: capítulo único, versículos com parênteses/vírgulas
  m = block.match(/^(\d+)\.(.+)$/);
  if(!m) return null;
  const chapter = +m[1];
  const nums = [...m[2].matchAll(/\d+/g)].map(n=>+n[0]);
  if(!nums.length) return null;
  return {book, c1:chapter, v1:Math.min(...nums), c2:chapter, v2:Math.max(...nums)};
}

function parseReading(refRaw){
  const ref = refPrincipal(refRaw);
  const blocks = ref.split(";");
  let currentBook = null;
  const parts = [];
  for(const rawBlock of blocks){
    const trimmed = rawBlock.trim();
    const m = trimmed.match(/^(\d?[A-Za-zÀ-ÿ]+)\s+(.+)$/);
    let book, rest;
    if(m && BOOK_IDS[m[1]]){
      book = m[1]; rest = m[2]; currentBook = book;
    } else if(currentBook){
      book = currentBook; rest = trimmed;
    } else {
      continue;
    }
    const parsed = parseRefBlock(book, rest);
    if(parsed) parts.push(parsed);
  }
  return parts;
}

function totalVerses(parts){
  return parts.reduce((sum,p)=>{
    if(p.v2===null) return sum + 25*(p.c2-p.c1+1); // capítulo(s) inteiro(s), estimativa
    if(p.c1===p.c2) return sum + (p.v2-p.v1+1);
    // aproximação grosseira para intervalos entre capítulos
    return sum + 40*(p.c2-p.c1) + p.v2;
  },0);
}

async function renderTexto(container, refRaw){
  container.className = "texto carregando";
  container.textContent = "Carregando texto…";
  try{
    const parts = parseReading(refRaw);
    if(!parts.length) throw new Error("Referência não reconhecida");
    if(totalVerses(parts) > MAX_INLINE_VERSES){
      container.className = "texto erro";
      container.textContent = "Leitura extensa — use o link abaixo para o texto completo.";
      return;
    }
    let html = "";
    for(const part of parts){
      const bookId = BOOK_IDS[part.book];
      if(!bookId) throw new Error("Livro não mapeado: "+part.book);
      const data = await fetchBook(bookId);
      for(let c=part.c1; c<=part.c2; c++){
        const chapterVerses = data.chapters[c-1];
        if(!chapterVerses) continue;
        const startV = (c===part.c1) ? part.v1 : 1;
        const endV = (c===part.c2 && part.v2!==null) ? Math.min(part.v2, chapterVerses.length) : chapterVerses.length;
        for(let v=startV; v<=endV; v++){
          const texto = chapterVerses[v-1];
          if(!texto) continue;
          html += `<span class="vnum">${v}</span>${texto} `;
        }
      }
    }
    if(!html){
      container.className = "texto erro";
      container.textContent = "Não foi possível localizar o texto — use o link abaixo.";
      return;
    }
    container.className = "texto";
    container.innerHTML = html.trim();
  }catch(err){
    container.className = "texto erro";
    container.textContent = "Não foi possível carregar o texto agora — use o link abaixo.";
  }
}

/* ---------- Utilidades de data ---------- */
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameYMD(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function ymdKey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}

function computeEaster(year){
  // Algoritmo de Meeus/Jones/Butcher (calendário gregoriano)
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}

function adventFirstSunday(year){
  const nov30=new Date(year,10,30);
  const dow=nov30.getDay(); // 0=domingo
  let offset=(0-dow+7)%7;
  if(offset>3) offset-=7;
  return addDays(nov30,offset);
}

function sundaysBetween(startExclusive, endExclusive){
  // retorna lista de domingos estritamente entre as duas datas
  let d=new Date(startExclusive);
  d=addDays(d,1);
  while(d.getDay()!==0) d=addDays(d,1);
  const out=[];
  while(d<endExclusive){
    out.push(new Date(d));
    d=addDays(d,7);
  }
  return out;
}

function cycleLetter(adventYear){
  const rem=(adventYear+1)%3;
  return rem===1?"A":rem===2?"B":"C";
}

/* ---------- Monta a lista de âncoras do ano eclesiástico corrente ---------- */
function buildAnchors(adventYear){
  const easterYear=adventYear+1;
  const letra=cycleLetter(adventYear);
  const R=CYCLES[letra];
  const easter=computeEaster(easterYear);
  const advent1=adventFirstSunday(adventYear);
  const christmasEve=new Date(adventYear,11,24);
  const christmasDay=new Date(adventYear,11,25);
  const epiphany=new Date(easterYear,0,6);
  const ashWednesday=addDays(easter,-46);
  const palmSunday=addDays(easter,-7);
  const ascension=addDays(easter,39);
  const pentecost=addDays(easter,49);
  const trinity=addDays(pentecost,7);

  const anchors=[];
  const push=(date,cor,nomeDia,periodo,leitura)=>anchors.push({date,cor,nomeDia,periodo,leitura});

  // Advento
  R.advento.forEach((leitura,idx)=>{
    push(addDays(advent1,idx*7),"Azul",`${idx+1}º Domingo do Advento`,`Tempo do Advento`,leitura);
  });

  push(christmasEve,"Branca","Véspera de Natal","Tempo de Natal",R.vespNatal);
  push(christmasDay,"Branca","O Nascimento do Senhor","Tempo de Natal",R.diaNatal);

  const domNatal=sundaysBetween(christmasDay, epiphany);
  if(domNatal[0]) push(domNatal[0],"Branca","1º Domingo após o Natal","Tempo de Natal",R.natal1);
  if(domNatal[1]) push(domNatal[1],"Branca","2º Domingo após o Natal","Tempo de Natal",R.natal2);

  push(epiphany,"Branca","A Epifania do Senhor","Tempo de Epifania",R.epifania);

  const domEpifania=sundaysBetween(epiphany, ashWednesday);
  domEpifania.forEach((d,idx)=>{
    const ultimo = idx===domEpifania.length-1;
    if(ultimo){
      push(d,"Branca","Transfiguração do Senhor","Tempo de Epifania",R.transfiguracao);
    } else if(R.epifaniaDom[idx]){
      const nome = idx===0?"Batismo do Senhor":`${idx+1}º Domingo após Epifania`;
      push(d,"Verde",nome,"Tempo de Epifania",R.epifaniaDom[idx]);
    }
  });

  push(ashWednesday,"Roxa","Quarta-feira de Cinzas",`Tempo da Quaresma`,R.cinzas);
  R.quaresma.forEach((leitura,idx)=>{
    push(addDays(ashWednesday,7*(idx+1)-3),"Roxa",`${idx+1}º Domingo na Quaresma`,`Tempo da Quaresma`,leitura);
  });
  // nota: 1º domingo na quaresma é o domingo seguinte à quarta de cinzas (4 dias depois)
  // ajuste: recalcular corretamente abaixo

  push(palmSunday,"Escarlate","Domingo de Ramos","Semana Santa",R.ramos);
  push(addDays(palmSunday,1),"Escarlate","Segunda-feira na Semana Santa","Semana Santa",R.semanaSanta.seg);
  push(addDays(palmSunday,2),"Escarlate","Terça-feira na Semana Santa","Semana Santa",R.semanaSanta.ter);
  push(addDays(palmSunday,3),"Escarlate","Quarta-feira na Semana Santa","Semana Santa",R.semanaSanta.qua);
  push(addDays(palmSunday,4),"Branca","Quinta-feira Santa","Semana Santa",R.semanaSanta.quinta);
  push(addDays(palmSunday,5),"Preta","Sexta-feira Santa","Semana Santa",R.semanaSanta.sexta);
  push(addDays(palmSunday,6),"Preta","Sábado de Aleluia","Semana Santa",R.semanaSanta.sabado);

  push(easter,"Branca","A Ressurreição do Senhor","Tempo de Páscoa",R.pascoa[0]);
  for(let n=2;n<=7;n++){
    push(addDays(easter,7*(n-1)),"Branca",`${n}º Domingo de Páscoa`,`Tempo de Páscoa`,R.pascoa[n-1]);
  }
  push(ascension,"Branca","A Ascensão do Senhor","Tempo de Páscoa",R.ascensao);
  push(pentecost,"Vermelha","Pentecostes","Tempo de Páscoa",R.pentecoste);
  push(addDays(pentecost,1),"Verde","Tempo Comum","Tempo Comum",[]);
  push(trinity,"Branca","A Santíssima Trindade","Tempo Comum",R.trindade);

  Object.keys(R.proprios).forEach(num=>{
    const [janela,leitura]=R.proprios[num];
    const doms=sundaysInWindow(easterYear, janela);
    doms.forEach(d=>{
      // só usa o Próprio se cair depois da Santíssima Trindade (evita colisão
      // com Pentecostes/Trindade em anos de Páscoa adiantada)
      if(d>trinity) push(d,"Verde",`Próprio ${num}`,`Tempo Comum`,leitura);
    });
  });

  // ---------- Dias Festivos de data fixa ----------
  const anchorDates = new Set(anchors.map(a=>ymdKey(a.date)));
  DIAS_FESTIVOS.forEach(f=>{
    // Nov/Dez pertencem ao início do ano eclesiástico (adventYear); o resto, ao easterYear
    const ano = (f.mes>=11) ? adventYear : easterYear;
    const data = new Date(ano, f.mes-1, f.dia);
    const key = ymdKey(data);
    if(anchorDates.has(key)) return; // não sobrepõe domingo/festa móvel já existente
    anchorDates.add(key);
    push(data, f.cor, f.nome, "Dia Festivo", f.leitura);
  });

  anchors.sort((a,b)=>a.date-b.date);
  return {anchors, letra, easterYear};
}

// corrige quaresma: recomputa corretamente (1º domingo = 4 dias após cinzas)
function fixLentAnchors(anchorsObj){
  return anchorsObj;
}

function sundaysInWindow(year, janela){
  // janela ex: "24-28/5" ou "31/7-6/8" ou "30/10 e 5/11" -> devolve domingo(s) daquele intervalo
  const doms=[];
  const parts=janela.split(" e ").map(s=>s.trim());
  parts.forEach(part=>{
    let start,end;
    if(part.includes("-")){
      const [a,b]=part.split("-");
      const bParts=b.split("/");
      const endMonth=parseInt(bParts[1],10);
      const endDay=parseInt(bParts[0].replace("º",""),10);
      let startDay, startMonth;
      if(a.includes("/")){
        const aParts=a.split("/");
        startDay=parseInt(aParts[0].replace("º",""),10);
        startMonth=parseInt(aParts[1],10);
      } else {
        startDay=parseInt(a.replace("º",""),10);
        startMonth=endMonth;
      }
      start=new Date(year,startMonth-1,startDay);
      end=new Date(year,endMonth-1,endDay);
    } else {
      const [d,m]=part.split("/");
      start=end=new Date(year,parseInt(m,10)-1,parseInt(d.replace("º",""),10));
    }
    let cur=new Date(start);
    while(cur<=end){
      if(cur.getDay()===0) doms.push(new Date(cur));
      cur=addDays(cur,1);
    }
  });
  return doms;
}

/* recompute lent Sundays correctly: rebuild after ash wednesday */
const _buildAnchorsCache = {};
function buildAnchorsFixed(adventYear){
  if(_buildAnchorsCache[adventYear]) return _buildAnchorsCache[adventYear];
  const {anchors, letra, easterYear} = buildAnchors(adventYear);
  const resultado = {anchors, letra, easterYear};
  _buildAnchorsCache[adventYear] = resultado;
  return resultado;
}

/* ---------- Resolve o dia de hoje ---------- */
function resolveToday(today){
  const Y=today.getFullYear();
  const advent1ThisY=adventFirstSunday(Y);
  let adventYear = today>=advent1ThisY ? Y : Y-1;

  let {anchors, letra} = buildAnchorsFixed(adventYear);

  let chosen=null;
  let seasonAnchor=null;
  let ehDiaProprio=false;

  for(const a of anchors){
    if(a.date<=today){
      chosen=a;
      // Track the last non-festive anchor to use as season fallback
      if(a.periodo !== "Dia Festivo"){
        seasonAnchor=a;
      }
      ehDiaProprio = sameDate(a.date, today);
    } else break;
  }

  // If today is not a specific feast day, fallback to the current season anchor
  if(!ehDiaProprio && seasonAnchor){
    chosen = seasonAnchor;
  }

  if(!chosen){ chosen=anchors[0]; ehDiaProprio=false; }
  return {chosen, letra, ehDiaProprio};
}

    document.getElementById("nomeDia").textContent=chosen.nomeDia;
    document.getElementById("periodoNome").textContent=chosen.periodo +

      btn.addEventListener("click",()=>{
        const textElement = btn.closest(".reading").querySelector(".texto");

        function indicateSuccess(){
          btn.textContent="Copiado ✓";
          btn.classList.add("copiado");
          setTimeout(()=>{btn.textContent="Copiar texto";btn.classList.remove("copiado");},1600);
        }

        function fallbackCopy(text){
          const ta = document.createElement('textarea');
          ta.value = text;
          // off-screen so it doesn't affect layout on mobile
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try{ ta.setSelectionRange(0, 99999); }catch(e){}
          try{
            const ok = document.execCommand('copy');
            if(ok) indicateSuccess();
          }catch(e){}
          document.body.removeChild(ta);
        }

        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(textToCopy).then(indicateSuccess).catch(()=>{
            fallbackCopy(textToCopy);
          });
        } else {
          fallbackCopy(textToCopy);

    });
  }

  document.querySelector(".toolbar").style.display = ehDiaProprio ? "flex" : "none";
}

document.getElementById("btnAnterior").addEventListener("click",()=>{
  viewDate = addDays(viewDate,-1);
  montarPagina();
});
document.getElementById("btnProximo").addEventListener("click",()=>{
  viewDate = addDays(viewDate,1);
  montarPagina();
});
document.getElementById("btnHoje").addEventListener("click",()=>{
  viewDate = new Date();
  viewDate.setHours(0,0,0,0);
  montarPagina();
});

/* ---------- Tamanho do texto ---------- */
const TEXT_SCALE_KEY = "diesSanctus_textScale";

function aplicarEscalaTexto(scale, salvar){
  document.documentElement.style.setProperty("--text-scale", scale);
  if(salvar) localStorage.setItem(TEXT_SCALE_KEY, scale);
  document.querySelectorAll(".text-size-popover button").forEach(b=>{
    b.classList.toggle("active", parseFloat(b.dataset.scale)===parseFloat(scale));
  });
}

(function initTextScale(){
  let salvo;
  try{ salvo = localStorage.getItem(TEXT_SCALE_KEY); }catch(e){ salvo = null; }
  aplicarEscalaTexto(salvo ? parseFloat(salvo) : 1, false);
})();

document.getElementById("btnTextSize").addEventListener("click",(e)=>{
  e.stopPropagation();
  const pop=document.getElementById("textSizePopover");
  pop.hidden = !pop.hidden;
});
document.querySelectorAll(".text-size-popover button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    aplicarEscalaTexto(btn.dataset.scale, true);
    document.getElementById("textSizePopover").hidden = true;
  });
});
document.addEventListener("click",(e)=>{
  const wrap=document.querySelector(".text-size-wrap");
  const pop=document.getElementById("textSizePopover");
  if(wrap && !pop.hidden && !wrap.contains(e.target)){
    pop.hidden = true;
  }
});

/* ---------- Calendário litúrgico (overlay) ---------- */
let calMonthDate = new Date();
calMonthDate.setDate(1);

function temFestivoOuComemoracao(date){
  const mes = date.getMonth()+1, dia = date.getDate();
  if(DIAS_FESTIVOS.some(f=>f.mes===mes && f.dia===dia)) return true;
  const key = `${mes}-${dia}`;
  return !!COMEMORACOES[key];
}

function renderCalendarGrid(){
  const year = calMonthDate.getFullYear();
  const month = calMonthDate.getMonth();

  const nomeMes = MESES[month];
  document.getElementById("calMonthLabel").textContent =
    `${nomeMes.charAt(0).toUpperCase()}${nomeMes.slice(1)} ${year}`;

  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  const hoje = new Date();
  hoje.setHours(0,0,0,0);

  for(let i=0;i<startWeekday;i++){
    const vazio = document.createElement("div");
    vazio.className = "cal-cell cal-cell--empty";
    grid.appendChild(vazio);
  }

  for(let dia=1; dia<=daysInMonth; dia++){
    const data = new Date(year, month, dia);
    const {chosen} = resolveToday(data);
    const corHex = CORES_HEX[chosen.cor] || CORES_HEX["Verde"];

    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cal-cell";
    cell.style.background = corHex + "33";
    cell.style.color = corHex;

    if(temFestivoOuComemoracao(data)){
      cell.classList.add("cal-cell--marcado");
      cell.style.borderColor = corHex;
    }
    if(sameDate(data, hoje)) cell.classList.add("cal-cell--hoje");
    if(sameDate(data, viewDate)) cell.classList.add("cal-cell--selecionado");

    cell.innerHTML = `<span>${dia}</span>`;
    cell.setAttribute("aria-label", formatarDataExtenso(data));
    cell.addEventListener("click", ()=>{
      viewDate = new Date(year, month, dia);
      viewDate.setHours(0,0,0,0);
      fecharCalendario();
      montarPagina();
    });
    grid.appendChild(cell);
  }

  const totalCells = startWeekday + daysInMonth;
  const restante = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<restante;i++){
    const vazio = document.createElement("div");
    vazio.className = "cal-cell cal-cell--empty";
    grid.appendChild(vazio);
  }
}

function abrirCalendario(){
  calMonthDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  renderCalendarGrid();
  document.getElementById("calendarOverlay").hidden = false;
}
function fecharCalendario(){
  document.getElementById("calendarOverlay").hidden = true;
}

document.getElementById("btnCalToggle").addEventListener("click",()=>{
  const overlay = document.getElementById("calendarOverlay");
  if(overlay.hidden) abrirCalendario(); else fecharCalendario();
});
document.getElementById("calClose").addEventListener("click", fecharCalendario);
document.getElementById("calendarOverlay").addEventListener("click",(e)=>{
  if(e.target.id === "calendarOverlay") fecharCalendario();
});
document.getElementById("calPrevMonth").addEventListener("click",()=>{
  calMonthDate = new Date(calMonthDate.getFullYear(), calMonthDate.getMonth()-1, 1);
  renderCalendarGrid();
});
document.getElementById("calNextMonth").addEventListener("click",()=>{
  calMonthDate = new Date(calMonthDate.getFullYear(), calMonthDate.getMonth()+1, 1);
  renderCalendarGrid();
});

montarPagina();
</script>
</body>
